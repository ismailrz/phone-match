services:
  postgres:
    image: postgres:16-alpine
    container_name: phonematch-db
    environment:
      POSTGRES_DB: phonematch
      POSTGRES_USER: phonematch
      POSTGRES_PASSWORD: phonematch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonematch -d phonematch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: node:22-alpine
    container_name: phonematch-migrate
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://phonematch:phonematch@postgres:5432/phonematch
    command: sh -c "npm ci && npx drizzle-kit migrate && node --import tsx/esm src/db/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - setup

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phonematch-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://phonematch:phonematch@postgres:5432/phonematch
      NODE_ENV: production
      LOG_LEVEL: info
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}  # Uncomment and set in .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
    driver: local
